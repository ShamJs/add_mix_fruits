<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruits</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="all">
        <div id="header">
            <img src="image.png" alt="" id="img-fruit">
            <h1 id="text-title">قائمة الفواكه التفاعلية</h1>
            <h2 id="text-details">أضف فاكهتك المفضلة ، و ادمج القوالب ، وعد العناصر بسهولة</h2>
            <p id="details2">.. فواكه اكثر
                <br><br>♡ حياة اجمل
            </p>
        </div>
        <br>
        <div id="one">
            <div class="list-once-fruit" id="list-once-fruit1">
                <div id="color-one">
                    <div id="num-fruits"><p>2:عدد الفواكه</p></div>
                    <h2 id="one-f">قائمة الفواكه الاولى</h2>
                </div>
                <div class="image">
                    <p id="apple">تفاح</p>
                    <img src="Glänzender roter Apfel mit Blatt.png" alt="" id="img-apple">
                </div>
                <div class="image">
                    <p id="grapes">عنب</p>
                    <img src="Frische violette Trauben mit Weinblättern.png" alt="" id="img-grapes">
                </div>
            </div>
            <div class="list-once-fruit" id="list-once-fruit2">
                <div id="color-two">
                    <div id="num-fruits2"><p>2:عدد الفواكه</p></div>
                    <h2 id="two-f">قائمة الفواكه الثانية</h2>
                </div>
                <div class="image">
                    <p id="banana">موز</p>
                    <img src="Banana.png" alt="" id="img-apple">
                </div>
                <div class="image">
                    <p id="orange">برتقال</p>
                    <img src="orange.png" alt="" id="img-grapes">
                </div>
            </div>
        </div>
        <br><br>
        <div id="two">
            <div class="add">
                <div class="add-fruit">
                    <p class="add-f">اضافة فاكهة الى القائمة الاولى</p>
                    <img src="Glänzender roter Apfel mit Blatt.png" alt="" class="add-afruit">
                </div>
                <div>
                    <button id="add-button1">+اضافة</button>
                    <input type="text" placeholder="...اكتب اسم الفاكهة" class="add-input" id="add-inp1">
                </div>
            </div>
            <div class="add">
                <div class="add-fruit">
                    <p class="add-f">اضافة فاكهة الى القائمة الثانية</p>
                    <img src="Glänzende Brombeertraube mit grünen Blättern.png" alt="" class="add-afruit">
                </div>
                <div>
                    <button id="add-button2">+اضافة</button>
                    <input type="text" placeholder="...اكتب اسم الفاكهة" class="add-input" id="add-inp2">
                </div>
            </div>
        </div>
        <br><br>
        <div id="two-in-one">
                <p id="all-list-fruit">القائمة المدمجة</p>
                <div id="but-fruits">
                    <button id="two-list">دمج القائمتين</button>
                    <div id="merged-fruits"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
